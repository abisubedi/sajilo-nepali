<style>
/* Layout idea: a single bright "Himalayan morning" world — a winding trail of lesson stones
   under a strip of prayer flags; lessons take over the screen like a game card. Single theme by choice. */
:root {
  --sky: #e8f4ff;
  --snow: #ffffff;
  --ink: #1f2a44;
  --muted: #5d6b86;
  --flag-blue: #2f6fd6;
  --flag-red: #e2453c;
  --flag-green: #2fa75a;
  --flag-yellow: #f6b71c;
  --panda: #e8742a;
  --line: #cfdcef;
  --good-bg: #e2f7e8;
  --bad-bg: #fde7e5;
  --display: "Baloo 2", "Noto Sans Devanagari", system-ui, sans-serif;
  --body: "Nunito", "Baloo 2", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--flag-blue); outline-offset: 3px; }
.ne { font-family: var(--display); }
.rom { display: inline-block; color: #1d4f9e; background: #eaf2ff; padding: 1px 9px; border-radius: 999px; font-size: .78em; font-weight: 800; line-height: 1.5; }
.hide-rom .rom { display: none; }

.flags { display: flex; height: 14px; }
.flags span { flex: 1; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); }
.flags span:nth-child(5n+1) { background: var(--flag-blue); }
.flags span:nth-child(5n+2) { background: var(--snow); }
.flags span:nth-child(5n+3) { background: var(--flag-red); }
.flags span:nth-child(5n+4) { background: var(--flag-green); }
.flags span:nth-child(5n+5) { background: var(--flag-yellow); }

.app { max-width: 640px; margin: 0 auto; padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 16px; min-height: calc(100% - 14px); }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand h1 { font-family: var(--display); font-size: 28px; line-height: 1; margin: 0; }
.brand h1 small { display: block; font-size: 15px; color: var(--muted); font-weight: 600; }
.stat { display: flex; align-items: center; gap: 4px; font-weight: 800; background: var(--snow); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; font-variant-numeric: tabular-nums; }

.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--snow); border: 2px solid var(--line); border-radius: 18px; padding: 6px; }
.levels button { border: 0; border-radius: 13px; padding: 8px 6px; background: transparent; font-weight: 800; line-height: 1.15; }
.levels button small { display: block; font-weight: 700; color: var(--muted); font-size: 13px; }
.levels button[aria-pressed="true"] { background: var(--flag-blue); color: var(--snow); }
.levels button[aria-pressed="true"] small { color: #d7e6ff; }

.greet { display: flex; gap: 12px; align-items: center; background: var(--snow); border-radius: 20px; padding: 12px 14px; border: 2px solid var(--line); }
.greet p { margin: 0; }
.greet .ne { font-size: 22px; font-weight: 700; }
.mascot { width: 64px; height: 64px; flex: none; }

/* trail */
.chapter { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 64px; }
.jump { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px; margin: 0 -2px; background: var(--sky, #e8f4ff); scrollbar-width: none; }
.jump::-webkit-scrollbar { display: none; }
.jump-pill { flex: none; border: 2px solid var(--line); background: var(--snow); border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 800; font-size: 14px; color: var(--ink); white-space: nowrap; box-shadow: 0 3px 0 var(--line); }
.jump-pill span { font-family: var(--display); }
.jump-pill.done { border-color: #f3d37a; background: #fff8e1; }
.chapter-banner { background: var(--snow); border: 2px solid var(--line); border-left: 8px solid var(--c, var(--flag-blue)); border-radius: 16px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chapter-banner small { display: block; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chapter-banner .ne { font-family: var(--display); font-size: 22px; font-weight: 800; }
.chapter-banner em { display: block; font-style: normal; font-weight: 700; color: var(--muted); font-size: 14px; }
.chapter-banner { position: relative; padding-bottom: 18px; }
.chapter-bar { position: absolute; left: 14px; right: 14px; bottom: 8px; height: 6px; border-radius: 999px; background: #e3ebf6; overflow: hidden; }
.chapter-bar b { display: block; height: 100%; background: var(--flag-yellow); border-radius: 999px; transition: width .3s; }
.chapter-stars { font-weight: 800; color: var(--flag-yellow); white-space: nowrap; font-variant-numeric: tabular-nums; }
.trail { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 8px 0 16px; }
.trail::before { content: ""; position: absolute; top: 30px; bottom: 30px; left: 50%; width: 4px; transform: translateX(-50%); background: repeating-linear-gradient(to bottom, #b9cbe6 0 10px, transparent 10px 20px); }
.stone { position: relative; display: flex; align-items: center; gap: 14px; width: auto; min-width: min(320px, 92%); max-width: 78%; background: var(--snow); border: 2px solid var(--line); border-radius: 999px; padding: 8px 20px 8px 8px; box-shadow: 0 4px 0 var(--line); text-align: left; }
.stone.earned { border-color: #f3d37a; }
.stone .label .stars span { color: var(--flag-yellow); font-size: 18px; }
.stone .label .stars span.off { color: var(--muted); }
.stone .label { flex: 1; }
.stone::after { content: "▶"; flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; padding-left: 3px; box-sizing: border-box; font-size: 14px; color: #8fa6c8; background: #eef3fb; border: 2px solid var(--line); }
.stone.next::after { color: var(--snow); background: var(--flag-blue); border-color: #1d4f9e; }
.stone.earned::after { color: #8a6400; background: #fff3c4; border-color: #f3d37a; }
.stone:nth-child(odd) { align-self: flex-start; }
.stone:nth-child(even) { align-self: flex-end; flex-direction: row-reverse; text-align: right; padding: 8px 8px 8px 20px; }
.disc { width: 72px; height: 72px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 38px; background: var(--c, var(--flag-blue)); box-shadow: 0 6px 0 rgba(31,42,68,.22); transition: transform .12s; }
.stone:hover .disc { transform: translateY(-2px); }
.stone:active .disc { transform: translateY(3px); box-shadow: 0 3px 0 rgba(31,42,68,.22); }
.stone[disabled] { cursor: not-allowed; }
.stone[disabled] .disc { background: #c9d3e3; filter: grayscale(1); opacity: .7; }
.stone .label strong { display: block; font-family: var(--display); font-size: 22px; line-height: 1.1; }
.stone .label span { color: var(--muted); font-weight: 700; font-size: 15px; }
.stone .label .rom, .chapter-banner .rom { color: #1d4f9e; font-size: 13px; }
.stone .label .next-tag { color: var(--snow); }
.stars { letter-spacing: 2px; font-size: 18px; color: var(--flag-yellow); }
.stars .off { color: var(--muted); }
.stars .off { opacity: .25; }

.settings { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.chip { border: 2px solid var(--line); background: var(--snow); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; }
.note { color: var(--muted); font-size: 14px; text-align: center; margin: 0; max-width: 60ch; align-self: center; }

/* lesson */
.lesson-top { display: flex; align-items: center; gap: 12px; }
.x { border: 0; background: none; font-size: 28px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.bar { flex: 1; height: 18px; background: #d5e1f2; border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--flag-green); border-radius: 999px; transition: width .3s; }
.hearts { font-weight: 800; color: var(--flag-red); font-variant-numeric: tabular-nums; }

.q { display: flex; flex-direction: column; gap: 16px; flex: 1; }
.ask { font-family: var(--display); font-size: 24px; font-weight: 700; margin: 0; text-wrap: balance; }
.prompt { background: var(--snow); border: 2px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.prompt .big { font-size: 72px; line-height: 1.1; }
.prompt .ne { font-size: 44px; font-weight: 700; line-height: 1.2; }
.prompt .en { font-size: 22px; font-weight: 800; }
.say { border: 0; background: var(--flag-blue); color: var(--snow); border-radius: 14px; padding: 8px 16px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; box-shadow: 0 4px 0 #1d4f9e; }
.say.huge { font-size: 26px; padding: 18px 28px; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { background: var(--snow); border: 2px solid var(--line); border-radius: 18px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 96px; box-shadow: 0 4px 0 var(--line); text-align: center; }
.opt .big { font-size: 46px; line-height: 1.1; }
.opt .ne { font-size: 28px; font-weight: 700; line-height: 1.2; }
.opt .en { font-weight: 800; }
.opt.sel { border-color: var(--flag-blue); background: #e6efff; box-shadow: 0 4px 0 var(--flag-blue); }
.opt.right { border-color: var(--flag-green); background: var(--good-bg); box-shadow: 0 4px 0 var(--flag-green); }
.opt.wrong { border-color: var(--flag-red); background: var(--bad-bg); box-shadow: 0 4px 0 var(--flag-red); }
.opt.gone { visibility: hidden; }
.opt[disabled] { cursor: default; }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .col { display: flex; flex-direction: column; gap: 10px; }
.match .opt { min-height: 74px; }

.answer { min-height: 64px; border-bottom: 3px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 6px 0; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { background: var(--snow); border: 2px solid var(--line); border-radius: 12px; padding: 6px 14px; box-shadow: 0 3px 0 var(--line); display: flex; flex-direction: column; align-items: center; }
.tile .ne { font-size: 24px; font-weight: 700; line-height: 1.2; }
.tile .rom { font-size: 13px; }
.tile.used { visibility: hidden; }

.feedback { position: sticky; bottom: 0; margin: 0 -16px -40px; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 10px; background: var(--sky); border-top: 2px solid var(--line); }
.feedback.good { background: var(--good-bg); border-color: var(--flag-green); }
.feedback.bad { background: var(--bad-bg); border-color: var(--flag-red); }
.feedback p { margin: 0; font-weight: 800; font-size: 19px; }
.feedback .sol { font-weight: 700; font-size: 17px; }
.go { border: 0; border-radius: 16px; padding: 14px; font-weight: 800; font-size: 19px; background: var(--flag-green); color: var(--snow); box-shadow: 0 5px 0 #1f7a40; width: 100%; }
.go[disabled] { background: #c9d3e3; box-shadow: 0 5px 0 #aab6c9; cursor: not-allowed; }
.feedback.bad .go { background: var(--flag-red); box-shadow: 0 5px 0 #a8271f; }

.done { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 20px; }
.done h2 { font-family: var(--display); font-size: 34px; margin: 0; line-height: 1.1; }
.done .stars { font-size: 48px; }
.done .mascot { width: 120px; height: 120px; }

@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.opt.right { animation: pop .3s; }
.opt.wrong { animation: shake .3s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 400px) {
  .disc { width: 70px; height: 70px; font-size: 32px; }
  .stone { width: 92%; }
  .prompt .ne { font-size: 38px; }
}

/* top bar toggles, Pandu pills, sheet, flashcards */
.levels-row { display: flex; gap: 8px; align-items: stretch; }
.levels-row .levels { flex: 1; }
.toggles { display: flex; gap: 6px; }
.icon-btn { border: 2px solid var(--line); background: var(--snow); border-radius: 14px; min-width: 52px; font-weight: 800; font-size: 20px; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 6px; }
.icon-btn small { font-size: 11px; color: var(--muted); }
.icon-btn[aria-pressed="true"] { border-color: var(--flag-green); background: var(--good-bg); color: #1f7a40; }
.icon-btn[aria-pressed="true"] small { color: #1f7a40; }
.icon-btn[aria-pressed="false"] { border-style: dashed; color: var(--muted); background: #f3f6fb; }
.greet p { font-weight: 700; }
.greet .ne { font-size: 20px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pill { background: var(--sky); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.sheet-back { position: fixed; inset: 0; background: rgba(31,42,68,.45); z-index: 20; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(640px, 100%); background: var(--snow); border-radius: 26px 26px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom)); z-index: 21; display: flex; flex-direction: column; gap: 12px; animation: up .2s ease-out; }
@keyframes up { from { transform: translate(-50%, 40px); opacity: .4; } }
.sheet-x { position: absolute; right: 10px; top: 8px; }
.sheet-head { display: flex; align-items: center; gap: 14px; padding-right: 40px; }
.sheet-head strong { display: block; font-family: var(--display); font-size: 24px; line-height: 1.1; }
.sheet-head .disc { width: 60px; height: 60px; font-size: 30px; }
.sheet-btn { display: flex; align-items: center; gap: 14px; border: 0; border-radius: 18px; padding: 14px 16px; font-size: 30px; text-align: left; color: var(--snow); }
.sheet-btn b { display: block; font-size: 20px; }
.sheet-btn small { display: block; font-size: 14px; font-weight: 700; opacity: .9; }
.sheet-btn.learn { background: var(--flag-blue); box-shadow: 0 5px 0 #1d4f9e; }
.sheet-btn.play { background: var(--flag-green); box-shadow: 0 5px 0 #1f7a40; }
.flashcard { background: var(--snow); border: 3px solid var(--line); border-radius: 28px; box-shadow: 0 6px 0 var(--line); padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 52vh; justify-content: center; touch-action: pan-y; }
.flashcard .ne { font-size: 46px; font-weight: 700; line-height: 1.2; }
.flashcard .en { font-size: 22px; font-weight: 800; }
.flashcard .rom { font-size: 20px; }
.card-nav { display: flex; justify-content: center; align-items: center; gap: 14px; }
.chip.big { font-size: 22px; padding: 10px 20px; }
.chip[disabled] { opacity: .35; }
.ctx { display: inline-block; background: #fff5d6; border: 2px solid #f3d37a; border-radius: 12px; padding: 4px 12px; font-weight: 800; font-size: 15px; color: var(--ink); }
/* stickers */
.stat-btn { cursor: pointer; font: inherit; font-weight: 800; color: var(--ink); }
.player-pill { margin-left: auto; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
.player-list { display: flex; flex-direction: column; gap: 8px; }
.player-row { display: flex; gap: 8px; align-items: center; }
.player-pick { flex: 1; display: flex; align-items: center; gap: 10px; background: var(--snow); border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px; font: inherit; color: var(--ink); text-align: left; }
.player-row.on .player-pick { border-color: var(--flag-blue); box-shadow: 0 3px 0 #b9cbe6; }
.player-pick b { flex: 1; } .player-pick small { font-weight: 800; color: var(--muted); } .player-pick em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--snow); background: var(--flag-blue); border-radius: 999px; padding: 2px 8px; }
.player-av { font-size: 30px; line-height: 1; }
.player-form { display: flex; flex-direction: column; gap: 8px; border-top: 2px dashed var(--line); padding-top: 10px; }
.player-form input { font: inherit; font-size: 18px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 12px; }
.avatar-row { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; justify-content: start; }
.avatar { font-size: 30px; width: 56px; height: 56px; padding: 0; border-radius: 50%; border: 2px solid var(--line); background: var(--snow); }
.avatar.on { border: 3px solid var(--flag-blue); background: #e8f0fd; }
.ico { flex: none; vertical-align: middle; }
/* Top bar: logo + player on the first row, all stats together on one row that never wraps */
.stats { display: flex; gap: 12px; flex-wrap: nowrap; align-items: center; }
@media (max-width: 640px) { .stats { flex: 1 1 100%; } }
@media (max-width: 440px) { .top { gap: 6px; } .stats { gap: 6px; } .stat { padding: 4px 9px; font-size: 14px; } }
@media (max-width: 360px) { .stat { padding: 3px 7px; font-size: 13px; } .player-pill { max-width: 38vw; } }
@media (max-width: 400px) { .levels-row { flex-wrap: wrap; } .toggles { flex: 1 1 100%; } .icon-btn { flex: 1; flex-direction: row; gap: 6px; padding: 8px 6px; } }
/* Creator & voice credit */
.sticker-pic { position: relative; }
.sticker-pic .art, .stick-say-pic .art { width: 100%; height: 100%; object-fit: contain; }
.sticker .sticker-pic { width: 72px; height: 72px; }
.sticker.new .sticker-pic { width: 84px; height: 84px; }
.lock-badge { position: absolute; right: -4px; bottom: -4px; font-size: 20px; filter: none; }
.sticker:not(.got) .sticker-pic { filter: grayscale(1); opacity: .45; }
.stick-say-pic { width: 44px; height: 44px; display: grid; place-items: center; position: relative; }
.stick-say-pic.locked .art { filter: grayscale(1); opacity: .5; }
.stick-say-pic .lock-badge { font-size: 16px; }
.av-img { width: 1.25em; height: 1.25em; object-fit: contain; vertical-align: middle; }
.player-pill .av-img { width: 24px; height: 24px; margin: -4px 0; }
.player-av .av-img { width: 40px; height: 40px; }
.avatar .av-img { width: 48px; height: 48px; }
/* Word pictures and lesson icons */
.big.has-art { line-height: 0; }
.wpic { width: 1.5em; height: 1.5em; object-fit: contain; display: block; }
.wotd-pic .wpic { width: 52px; height: 52px; }
.pc-pic .wpic { width: 1.4em; height: 1.4em; margin: 0 auto; }
.disc .li-art { width: 86%; height: 86%; object-fit: contain; }
.disc:has(.li-art) { background: var(--snow); border: 3px solid var(--c, var(--flag-blue)); box-sizing: border-box; }
/* Pandu artwork + gentle motion */
.pandu-art { object-fit: contain; }
.brand .brand-pandu { width: 48px; height: 48px; }
.greet .mascot { width: 84px; height: 84px; }

<script>if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
<script>
/* ---------- Saved progress (this browser only) ---------- */
/* Players: each child on this device has their own stars, streak and stickers.
   Player 1 keeps the original storage key, so progress saved before players existed is kept. */
const PKEY = "sajilo-nepali-players";
const AVATARS = ["🐼", "🐯", "🐘", "🦏", "🦚", "🐆", "🐃", "🐒"];   // red panda, tiger, elephant, rhino, danphe, snow leopard, yak, monkey
const keyFor = id => id === "p1" ? "sajilo-nepali-v1" : "sajilo-nepali-" + id;
function loadPlayers() {
  try { const x = JSON.parse(localStorage.getItem(PKEY) || "null"); if (x && x.list && x.list.length) return x; } catch (e) {}
  return { current: "p1", list: [{ id: "p1", name: "Player 1", avatar: "🐼" }] };
}
let PL = loadPlayers();
if (!PL.list.some(x => x.id === PL.current)) PL.current = PL.list[0].id;
const savePlayers = () => { try { localStorage.setItem(PKEY, JSON.stringify(PL)); } catch (e) {} };
const me = () => PL.list.find(x => x.id === PL.current);
let KEY = keyFor(PL.current);
const defaults = { level: "little", romBy: { little: true, big: false }, sound: true, beeps: true, stars: {}, xp: 0, streak: 0, lastDay: "", freezes: 0 };
const fresh = () => JSON.parse(JSON.stringify(defaults));
let P = load();
function load() { try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { return fresh(); } }
if (!P.romBy) P.romBy = { little: true, big: false };
/* How each age level plays */
const LEVELS = {
  little: { name: "Little learners", ages: "4–7", options: 3, questions: 6, hearts: 0, mascot: "Tap the pictures and listen. There's no wrong way to play!" },
  big: { name: "Big learners", ages: "8–15", options: 4, questions: 12, hearts: 3, mascot: "Challenge mode: 12 questions, 3 hearts, typing and sentences. How far can you go?" },
};
const LV = () => LEVELS[P.level];
const romOn = () => !!P.romBy[P.level];
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
const starKey = id => P.level + ":" + id;
const dayKey = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
const today = () => dayKey(new Date());
const yesterday = () => { const y = new Date(); y.setDate(y.getDate() - 1); return dayKey(y); };
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dayKey(d); };
/* Streak: a ❄️ freeze is earned every 7 days in a row (keep up to 2). Missing one day uses a freeze instead of losing the 🔥. */
function bumpStreak() {
  const t = today(); S.streakNews = ""; if (P.lastDay === t) return;
  P.freezes = P.freezes || 0;
  if (P.lastDay === yesterday()) P.streak += 1;
  else if (P.lastDay === daysAgo(2) && P.freezes > 0) { P.freezes -= 1; P.streak += 1; S.streakNews = "❄️ A streak freeze saved your 🔥 streak!"; }
  else P.streak = 1;
  if (P.streak % 7 === 0 && P.freezes < 2) { P.freezes += 1; S.streakNews = `❄️ ${P.streak} days in a row! You earned a streak freeze.`; }
  P.lastDay = t;
}
const liveStreak = () => (P.lastDay === today() || P.lastDay === yesterday() || (P.lastDay === daysAgo(2) && P.freezes > 0)) ? P.streak : 0;

/* ---------- Audio: recorded clips first, device voice as backup ---------- */
const AUDIO = window.AUDIO || {};
const SPEECH = {};   // key -> text for the device voice
let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^ne/i.test(v.lang)) || vs.find(v => /^hi/i.test(v.lang)) || null;
}
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
const canSay = key => !!AUDIO[key] || !!voice;
let current = null, lastEl = null, player = null;
function say(key, el) {
  if (!P.sound || !key) return;
  if (lastEl) lastEl.classList.remove("playing");
  if (el) { el.classList.add("playing"); lastEl = el; }
  const done = () => { if (el) el.classList.remove("playing"); };
  try { if (current) current.pause(); if (window.speechSynthesis && speechSynthesis.speaking) speechSynthesis.cancel(); } catch (e) {}
  if (AUDIO[key]) {
    // One shared player: iPhones only allow sound from a player the child has already tapped.
    const a = player || (player = new Audio());
    a.onended = done; a.onerror = done; a.src = AUDIO[key]; current = a;
    try { a.currentTime = 0; } catch (e) {}
    const pr = a.play(); if (pr) pr.catch(done); return;
  }
  if (!voice) { setTimeout(done, 300); return; }
  try {
    const u = new SpeechSynthesisUtterance(SPEECH[key] || key.replace(/^L:/, ""));
    u.voice = voice; u.lang = voice.lang; u.rate = .8; u.onend = done; speechSynthesis.speak(u);
  } catch (e) { done(); }
}
let actx = null;
function beep(kind) {
  if (!P.sound || P.beeps === false) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === "good" ? [660, 880] : kind === "bad" ? [220, 180] : [520];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === "bad" ? "sawtooth" : "triangle"; o.frequency.value = f;
      const t = actx.currentTime + i * .11, peak = kind === "bad" ? .1 : kind === "tap" ? .08 : .22;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .18);
    });
  } catch (e) {}
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickN = (a, n) => shuffle(a).slice(0, n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const K = t => window.audioKey(t);
// Clickable Nepali text: tap it to hear it.
const neSpan = (text, cls = "ne", key = K(text)) => `<span class="${cls}" lang="ne" data-say="${esc(key)}" title="Tap to hear">${esc(text)}</span>`;
const neHTML = (ne, rom, key) => `${neSpan(ne, "ne", key)}<span class="rom">${esc(rom)}</span>`;
const isLabel = pic => /^(SUN|MON|TUE|WED|THU|FRI|SAT|\d+)$/.test(pic);
/* Word pictures: the artwork in img/ when there is one (named w-<english>), otherwise the emoji.
   Pass the word itself (it needs .pic and .en); a plain emoji string also works. */
const slugOf = s => String(s).toLowerCase().replace(/\(polite\)/g, "polite").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const artFor = x => x && typeof x === "object" && (x.art || (x.en && (window.IMG || {})["w-" + slugOf(x.en)]));
/* A picture for a sentence: its own scene (s-<lesson>-<n>) if drawn, otherwise the picture of a word in it,
   looking from the end (where Nepali puts the main noun) and allowing endings like -मा, -ले, -को, -लाई. */
let WORDS = null;
const SKIP = new Set(["हो", "होइन", "छ", "छैन", "म", "मेरो", "यो", "तिमी", "मलाई", "के", "हजुर", "ठीक", "अब", "यहाँ"]);
const NOUN_LESSONS = new Set(["animals", "respect-family", "kitchen-tummy", "body", "rooms-house", "house-objects", "clothes", "sports-outdoors",
  "weather-nature", "festivals-culture", "nepali-treats", "birds-bugs", "vehicles-travel", "school-supplies", "fruits-snacks", "time-of-day"]);
function sentencePic(l, s, i) {
  const scene = (window.IMG || {})[`s-${l.id}-${i + 1}`];
  if (scene) return { art: scene, pic: "💬" };
  if (s.pic) return { art: null, pic: s.pic };   // a sentence can set its own emoji
  if (!WORDS) { WORDS = new Map(); window.LESSONS.forEach(x => !x.letters && (x.items || []).forEach(it => { if (!WORDS.has(it.ne)) WORDS.set(it.ne, { it, noun: NOUN_LESSONS.has(x.id) }); })); }
  let best = null;
  [...s.ne].reverse().forEach((w, pos) => {
    if (SKIP.has(w)) return;
    const hit = WORDS.get(w) || WORDS.get(w.replace(/(मा|ले|को|लाई|हरू)$/, ""));
    if (!hit || isLabel(hit.it.pic)) return;
    const art = artFor(hit.it), score = (hit.noun ? 4 : 0) + (art ? 2 : 0) - pos * 0.01;   // nouns first, then artwork, then nearer the end
    if (!best || score > best.score) best = { score, art, pic: hit.it.pic };
  });
  return best ? { art: best.art || null, pic: best.pic } : { art: null, pic: "💬" };
}

const picHTML = (x, size) => {
  const pic = typeof x === "object" ? x.pic : x, art = artFor(x);
  const st = size ? ` style="font-size:${size}px"` : "";
  if (art) return `<span class="big has-art"${st}><img class="wpic" src="${art}" alt="" draggable="false"></span>`;
  return isLabel(pic) ? `<span class="pic-label">${esc(pic)}</span>` : `<span class="big"${st}>${esc(pic)}</span>`;
};
const iconHTML = l => (window.IMG || {})["li-" + l.id] ? `<img class="li-art" src="${window.IMG["li-" + l.id]}" alt="" draggable="false">` : `<span lang="ne" style="font-family:var(--display)">${esc(l.icon)}</span>`;

/* ---------- Question builder ---------- */
function buildQuestions(lesson) {
  const big = P.level === "big";
  const total = LV().questions;
  if (lesson.sentences) return pickN(lesson.sentences, Math.min(total, lesson.sentences.length)).map(s => ({ type: "build", s }));
  const items = lesson.items, qs = [];
  let types;
  if (lesson.letters) types = big ? ["letterPic", "listenLetter", "letterFind", "trace", "listenLetter", "letterFind"] : ["letterPic", "trace", "listenLetter", "letterPic"];
  else types = big ? ["pickNepaliText", "typeMeaning", "listen", "pickMeaning", "typeMeaning", "pickNepaliText"] : ["pickMeaning", "pickNepali", "listen", "pickMeaning"];
  if (lesson.count) types.push("count", "count");
  const pool = shuffle(items);
  for (let i = 0; qs.length < total; i++) {
    const item = pool[i % pool.length];
    let t = types[i % types.length];
    if (lesson.letters) {
      // Letters without an example word (ञ, अः) can't do picture questions; ङ (नङ) doesn't start its word.
      if (t === "letterPic" && !item.word) t = "listenLetter";
      if (t === "letterFind" && (!item.word || item.hint)) t = big ? "trace" : "listenLetter";
    }
    if ((t === "listen" || t === "listenLetter") && !canSay(itemKey(lesson, item))) t = lesson.letters ? "trace" : "pickMeaning";
    qs.push({ type: t, item });
  }
  if (!lesson.letters) qs.splice(Math.min(3, qs.length), 0, { type: "match", items: pickN(items, big ? 5 : 3) });
  qs.forEach(q => {
    if (!q.item) return;
    const pool = items.filter(x => x !== q.item && (q.type !== "letterPic" || x.word));   // picture options need a picture word
    q.opts = shuffle([q.item, ...pickN(pool, LV().options - 1)]);
  });
  return qs;
}

/* ---------- Save codes: move every player's progress to another device, no account needed ---------- */
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0)));
function makeSaveCode() {
  save(); savePlayers();
  const data = {}; PL.list.forEach(x => { data[x.id] = localStorage.getItem(keyFor(x.id)) || "{}"; });
  return "SAJILO1-" + b64(JSON.stringify({ players: PL, data }));
}
function loadSaveCode(code) {
  const raw = String(code).trim().replace(/\s+/g, "");
  if (!raw.startsWith("SAJILO1-")) throw new Error("That doesn't look like a Sajilo Nepali save code.");
  const o = JSON.parse(unb64(raw.slice(8)));
  if (!o.players || !Array.isArray(o.players.list) || !o.players.list.length || !o.data) throw new Error("This save code is incomplete.");
  o.players.list.forEach(x => { if (!/^p\d+$/.test(x.id)) throw new Error("This save code is damaged."); JSON.parse(o.data[x.id] || "{}"); });
  PL.list.forEach(x => { try { localStorage.removeItem(keyFor(x.id)); } catch (e) {} });
  o.players.list.forEach(x => localStorage.setItem(keyFor(x.id), o.data[x.id] || "{}"));
  localStorage.setItem(PKEY, JSON.stringify(o.players));
  return o.players.list.length;
}

async function saveSoundsOffline(btn) {
  const urls = [...new Set(Object.values(AUDIO))];
  if (!navigator.serviceWorker.controller) { btn.textContent = "Reload the page once, then try again"; return; }
  let n = 0; btn.disabled = true;
  const next = async () => { while (urls.length) { const u = urls.pop(); try { await fetch(u); } catch (e) {} n++; btn.textContent = `Saving sounds… ${n}/${n + urls.length}`; } };
  await Promise.all(Array.from({ length: 6 }, next));
  btn.textContent = "✓ All sounds saved for offline"; P.offlineSaved = today(); save();
}

/* Kids hear a few cards before the quiz unlocks. */
const learnNeeded = () => Math.min(3, (S.lesson.items || []).length);
const learnLabel = heard => heard >= learnNeeded() ? "Start the quiz" : `Tap ${learnNeeded()} cards to start (${heard}/${learnNeeded()})`;

/* ---------- Tracing ---------- */
const TR = { mask: null, ink: null, total: 0, drawn: false };
async function setupTrace(item) {
  const box = $("#traceBox"), guide = $("#guide"), ink = $("#ink");
  const size = Math.round(box.clientWidth), dpr = window.devicePixelRatio || 1;
  [guide, ink].forEach(c => { c.width = size * dpr; c.height = size * dpr; c.getContext("2d").scale(dpr, dpr); });
  try { await document.fonts.load(`700 ${size * .7}px "Baloo 2"`, item.ne); } catch (e) {}
  const font = `700 ${Math.round(size * .7)}px "Baloo 2", "Noto Sans Devanagari", sans-serif`;
  const drawLetter = (ctx, fill) => { ctx.font = font; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = fill; ctx.fillText(item.ne, size / 2, size * .56); };
  const g = guide.getContext("2d"); g.clearRect(0, 0, size, size); drawLetter(g, "#d9e4f4");
  g.setLineDash([6, 8]); g.lineWidth = 2; g.strokeStyle = "#9fb3d1"; g.font = font; g.textAlign = "center"; g.textBaseline = "middle"; g.strokeText(item.ne, size / 2, size * .56);
  // low-res masks for scoring
  const N = 120, sc = N / size;
  const mk = () => { const c = document.createElement("canvas"); c.width = c.height = N; const x = c.getContext("2d"); x.scale(sc, sc); return [c, x]; };
  const [mc, mx] = mk(); drawLetter(mx, "#000");
  const [nc, nx] = mk(); drawLetter(nx, "#000"); nx.lineWidth = size * .09; nx.strokeStyle = "#000"; nx.font = font; nx.strokeText(item.ne, size / 2, size * .56);
  const md = mx.getImageData(0, 0, N, N).data, nd = nx.getImageData(0, 0, N, N).data;
  TR.mask = []; TR.near = []; for (let i = 0; i < N * N; i++) { TR.mask[i] = md[i * 4 + 3] > 100; TR.near[i] = nd[i * 4 + 3] > 40; }
  TR.total = TR.mask.filter(Boolean).length;
  const [ic, ix] = mk(); TR.inkCanvas = ic; TR.inkCtx = ix; TR.N = N; TR.drawn = false;
  const c = ink.getContext("2d");
  [c, ix].forEach(x => { x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#e8742a"; x.lineWidth = size * .085; });
  let drawing = false, last = null;
  const pos = e => { const r = ink.getBoundingClientRect(); return [(e.clientX - r.left) * size / r.width, (e.clientY - r.top) * size / r.height]; };
  ink.onpointerdown = e => { drawing = true; last = pos(e); ink.setPointerCapture(e.pointerId); dot(last); };
  ink.onpointermove = e => { if (!drawing) return; const p = pos(e); [c, ix].forEach(x => { x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); }); last = p; TR.drawn = true; updateMeter(); };
  ink.onpointerup = ink.onpointercancel = () => { drawing = false; updateMeter(); };
  const dot = p => { [c, ix].forEach(x => { x.beginPath(); x.moveTo(...p); x.lineTo(p[0] + .1, p[1]); x.stroke(); }); TR.drawn = true; };
  $("#traceClear").onclick = () => { c.clearRect(0, 0, size, size); ix.clearRect(0, 0, size, size); TR.drawn = false; updateMeter(); };
}
function traceScore() {
  const d = TR.inkCtx.getImageData(0, 0, TR.N, TR.N).data; let hit = 0, inked = 0, outside = 0;
  for (let i = 0; i < TR.N * TR.N; i++) { const on = d[i * 4 + 3] > 60; if (on) { inked++; if (!TR.near[i]) outside++; } if (on && TR.mask[i]) hit++; }
  return { cover: TR.total ? hit / TR.total : 0, stray: inked ? outside / inked : 0 };
}
function updateMeter() {
  const s = traceScore(); $("#meter").style.width = Math.min(100, Math.round(s.cover / .6 * 100)) + "%";
  const ch = $("#check"); if (ch) ch.disabled = !TR.drawn;
}

/* ---------- Answers ---------- */
function setFeedback(good, solutionHTML) {
  const fb = $("#fb");
  const ch = window.CHEERS[Math.floor(Math.random() * window.CHEERS.length)];
  fb.className = "feedback " + (good ? "good" : "bad");
  fb.innerHTML = good
    ? `<div class="fb-row">${pandu(window.PANDU_IMG && window.PANDU_IMG.cheer ? "cheer" : "wave", "fb-pandu pop")}<p>🎉 ${neSpan(ch[0])} <span class="rom">${ch[1]}</span> ${ch[2]}</p></div><button class="go" type="button" id="next">Continue</button>`
    : `<div class="fb-row">${pandu("oops", "fb-pandu pop")}<div><p>Not quite. The answer is:</p><div class="sol">${solutionHTML}</div></div></div><button class="go" type="button" id="next">Got it</button>`;
  $("#next").focus();
}
function grade(good) {
  S.answered = true; beep(good ? "good" : "bad");
  const q = S.queue.shift();
  if (good) S.done++; else { S.mistakes++; S.hearts--; S.queue.push(q); }
}
function checkChoice() {
  const q = S.queue[0], l = S.lesson; if (S.sel == null || S.answered) return;
  const good = q.opts[S.sel] === q.item;
  document.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if (q.opts[i] === q.item) b.classList.add("right"); else if (i === S.sel) b.classList.add("wrong"); });
  grade(good);
  if (l.letters) {
    say(itemKey(l, q.item));
    setFeedback(good, q.item.word ? `${neHTML(q.item.ne, q.item.rom, itemKey(l, q.item))} as in ${neHTML(q.item.word, q.item.wordRom)} = ${esc(q.item.en)}` : neHTML(q.item.ne, q.item.rom, itemKey(l, q.item)));
  } else {
    say(K(q.item.ne));
    setFeedback(good, `${neHTML(q.item.ne, q.item.rom)} = ${esc(q.item.en)}`);
  }
}
/* Typed answers: ignore case, punctuation, "(polite)" notes, a/the/my/to, contractions (im = i'm = i am),
   UK/US spellings, plurals and one small typo. Grown-ups can also accept an answer from the "Answers to check" list. */
const SPELL = { mum: "mom", mummy: "mom", mommy: "mom", mumma: "mom", colour: "color", colours: "colors", grey: "gray", yoghurt: "yogurt",
  aeroplane: "airplane", favourite: "favorite", u: "you", ur: "your", pls: "please", plz: "please", ok: "okay", okey: "okay", thanx: "thanks", thx: "thanks", tv: "television" };
const CONTRACT = [[/\bi m\b|\bim\b/g, "i am"], [/\b(do|did|does|is|are|was|were|have|has)n t\b/g, "$1 not"], [/\b(do|did|does|is|are|was|were|have|has)nt\b/g, "$1 not"],
  [/\bcan t\b|\bcant\b|\bcannot\b/g, "can not"], [/\bwon t\b|\bwont\b/g, "will not"], [/\bit s\b|\bits\b/g, "it is"], [/\blet s\b|\blets\b/g, "let us"],
  [/\bwhat s\b|\bwhats\b/g, "what is"], [/\bthat s\b|\bthats\b/g, "that is"], [/\bwhere s\b|\bwheres\b/g, "where is"], [/\bi ve\b|\bive\b/g, "i have"]];
const norm = t => {
  let s = String(t).toLowerCase().replace(/\([^)]*\)/g, " ").replace(/[’']/g, " ").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  for (const [re, to] of CONTRACT) s = s.replace(re, to);
  return s.split(" ").map(w => SPELL[w] || w).join(" ").replace(/^(a|an|the|my|to) /, "").trim();
};
const stem = s => s.split(" ").map(w => w.length <= 3 ? w : w.replace(/ies$/, "y").replace(/(ss|sh|ch|x|z)es$/, "$1").replace(/([^s])s$/, "$1")).join(" ").replace(/ph/g, "f").replace(/([a-z])\1/g, "$1");
function typedOK(got, answers) {
  const g = norm(got), gs = stem(g);
  return answers.map(norm).some(a => a === g || stem(a) === gs || (a.length > 4 && gs.length > 3 && lev(stem(a), gs) <= 1));
}
function checkTyped() {
  const q = S.queue[0]; if (S.answered) return;
  const typed = $("#typed").value;
  const answers = [q.item.en, ...(q.item.alt || []), ...((window.MORE_ANSWERS || {})[q.item.en.toLowerCase()] || []), ...((P.accepted || {})[q.item.en] || []), ...(q.item.n ? [String(q.item.n)] : [])];
  const good = typedOK(typed, answers);
  if (!good && norm(typed)) {   // remember it so a grown-up can check it
    P.misses = (P.misses || []).filter(m => !(m.en === q.item.en && m.got === norm(typed)));
    P.misses.unshift({ en: q.item.en, ne: q.item.ne, got: norm(typed), day: today() }); P.misses = P.misses.slice(0, 30); save();
  }
  $("#typed").disabled = true; grade(good); say(K(q.item.ne));
  setFeedback(good, `${neHTML(q.item.ne, q.item.rom)} = ${esc(q.item.en)}`);
}
function lev(a, b) { const d = Array.from({ length: a.length + 1 }, (_, i) => [i]); for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
function checkTrace() {
  const q = S.queue[0]; if (S.answered) return;
  const s = traceScore(), good = s.cover >= .55 && s.stray <= .45;
  if (!good) {   // tracing is practice: no heart lost, just try again
    beep("bad");
    $("#fb").innerHTML = `<p>${s.cover < .55 ? "Keep going! Cover more of the letter." : "Try to stay on the letter."}</p><button class="go" type="button" id="check">Check</button>`;
    return;
  }
  grade(true); say(window.letterKey(q.item));
  setFeedback(true, "");
}
function checkBuild() {
  const q = S.queue[0]; if (S.answered) return;
  const good = S.built.map(i => S.bank[i][0]).join(" ") === q.s.ne.join(" ");
  grade(good); if (good) say(K(q.s.ne.join(" ")));
  setFeedback(good, q.s.ne.map((w, i) => neHTML(w, q.s.rom[i])).join(" "));
}
function drawBuilt() {
  $("#answer").innerHTML = S.built.map((ti, pos) => `<button class="tile" type="button" data-b="${pos}"><span class="ne" lang="ne">${esc(S.bank[ti][0])}</span><span class="rom">${esc(S.bank[ti][1])}</span></button>`).join("");
  document.querySelectorAll("#bank .tile").forEach(b => b.classList.toggle("used", S.built.includes(+b.dataset.t)));
  $("#check").disabled = S.built.length === 0;
}
function matchTap(side, i) {
  const q = S.queue[0];
  const btn = document.querySelector(`[data-${side}="${i}"]`);
  document.querySelectorAll(`[data-${side}]`).forEach(b => b.classList.remove("sel"));
  btn.classList.add("sel");
  if (side === "l") { S.pickL = i; say(K(S.matchLeft[i].ne), btn); } else { S.pickR = i; beep("tap"); }
  if (S.pickL == null || S.pickR == null) return;
  const L = document.querySelector(`[data-l="${S.pickL}"]`), R = document.querySelector(`[data-r="${S.pickR}"]`);
  if (S.matchLeft[S.pickL] === S.matchRight[S.pickR]) {
    beep("good"); L.classList.add("right"); R.classList.add("right"); L.disabled = R.disabled = true;
    setTimeout(() => { L.classList.add("gone"); R.classList.add("gone"); }, 350);
    S.pairs++;
    if (S.pairs === q.items.length) { S.queue.shift(); S.done++; setTimeout(nextStep, 600); }
  } else {
    beep("bad"); L.classList.add("wrong"); R.classList.add("wrong");
    setTimeout(() => { L.classList.remove("wrong", "sel"); R.classList.remove("wrong", "sel"); }, 450);
  }
  S.pickL = S.pickR = null;
}
function nextStep() {
  if (S.hearts <= 0) { S.screen = "done"; S.outOfHearts = true; render(); return; }
  if (!S.queue.length) {
    const stars = S.mistakes === 0 ? 3 : S.mistakes <= 2 ? 2 : 1, k = starKey(S.lesson.id);
    S.earned = stars; S.xpGain = 10 + stars * 5;
    const before = new Set(stickerState().filter(x => x.got).map(x => x.id + (x.gold ? "*" : "")));
    P.stars[k] = Math.max(P.stars[k] || 0, stars); P.xp += S.xpGain; bumpStreak(); save();
    S.newSticker = stickerState().find(x => x.got && !before.has(x.id + (x.gold ? "*" : ""))) || null;
    S.screen = "done"; S.outOfHearts = false; render(); say(K(window.PHRASES.wellDone)); return;
  }
  render(); window.scrollTo(0, 0);
}
function renderDone() {
  if (S.outOfHearts) {
    $("#app").innerHTML = `<section class="done">${pandu("oops", "pop")}<h2>Out of hearts!</h2><p>That's okay. Practice makes perfect.<br>${neSpan(window.PHRASES.tryAgain)} <span class="rom">pheri prayas garaun!</span> Let's try again!</p>
      <button class="go" type="button" id="again">Try again</button><button class="chip" type="button" id="home">Back to lessons</button></section>`;
    say(K(window.PHRASES.tryAgain));
    return;
  }
  const st = [1, 2, 3].map(n => `<span class="${n <= S.earned ? "" : "off"}">★</span>`).join("");
  $("#app").innerHTML = `<section class="done">${pandu(window.PANDU_IMG && window.PANDU_IMG.cheer ? "cheer" : "wave", "pop")}<h2>${neSpan(window.PHRASES.wellDone)}<br>Lesson complete!</h2>
    <div class="stars" aria-label="${S.earned} of 3 stars">${st}</div>
    <p><strong>+${S.xpGain} points</strong> · 🔥 ${liveStreak()} day streak<br>${S.mistakes === 0 ? "Perfect, no mistakes!" : S.mistakes + " mistake" + (S.mistakes > 1 ? "s" : "") + ". Play again for 3 stars."}</p>
    ${S.streakNews ? `<p class="ctx">${esc(S.streakNews)}</p>` : ""}
    ${S.newSticker ? `<button class="sticker got${S.newSticker.gold ? " gold" : ""} new" type="button" data-sticker="${S.newSticker.id}"><span class="sticker-pic">${stickerPic(S.newSticker)}</span><b>🎉 New sticker: ${esc(S.newSticker.name)}${S.newSticker.gold ? " (gold!)" : ""}</b></button>` : ""}
    ${S.earned === 3 ? `<div class="share-card"><p><b>Share your score with Aama or Baba!</b></p><p class="share-text" id="shareText">${esc(shareText())}</p>
      <div class="share-btns">${navigator.share ? `<button class="say" type="button" id="shareNow">📤 Share</button>` : ""}<button class="chip" type="button" id="copyShare">📋 Copy message</button></div></div>` : ""}
    <button class="go" type="button" id="home">Continue</button><button class="chip" type="button" id="again">Play again</button></section>`;
  if (S.earned === 3) confetti();
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div"); box.className = "confetti"; box.setAttribute("aria-hidden", "true");
  const bits = ["🎉", "⭐", "🌟", "🎊", "🪁"], cols = ["#2f6fd6", "#e2453c", "#2fa75a", "#f6b71c", "#e8742a"];
  for (let i = 0; i < 46; i++) {
    const s = document.createElement("i");
    if (i % 4 === 0) s.textContent = bits[i % bits.length]; else s.style.background = cols[i % cols.length];
    s.style.left = Math.random() * 100 + "vw"; s.style.animationDelay = Math.random() * .6 + "s";
    s.style.animationDuration = 1.6 + Math.random() * 1.4 + "s"; s.style.setProperty("--x", (Math.random() * 160 - 80) + "px");
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3800);
}
function shareText() {
  const n = liveStreak();
  return `I got 3 stars in “${S.lesson.title}” on Sajilo Nepali! 🌟${n > 1 ? ` 🔥 ${n}-day streak!` : ""} Learn with me: https://sajilonepali.app`;
}

/* Share: the phone's share sheet when it works; otherwise copy the text and say so (some computers have no
   working share sheet). Cancelling the share sheet yourself does nothing. */
function shareOrCopy(btn, data, copyText) {
  const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
  const say = (msg, ms = 3500) => { btn.textContent = msg; clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = label; }, ms); };
  const copy = () => {
    const done = () => say("✓ Link copied! Paste it in a message");
    const fail = () => say(copyText.match(/https?:\/\/\S+/)[0], 8000);
    try { navigator.clipboard.writeText(copyText).then(done, () => { legacyCopy(copyText) ? done() : fail(); }); }
    catch (err) { legacyCopy(copyText) ? done() : fail(); }
  };
  if (navigator.share && (!navigator.canShare || navigator.canShare(data))) {
    navigator.share(data).then(() => say("✓ Shared! Thank you"), err => { if (!err || err.name !== "AbortError") copy(); });
  } else copy();
}
function legacyCopy(text) {
  const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); return ok;
}
function selectShare() { const el = $("#shareText"); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  if (e.target.id === "sheetBack") { S.sheet = null; render(); return; }
  if (e.target.id === "stickBack") { S.stickers = false; render(); return; }
  if (e.target.id === "grownBack") { S.grown = null; render(); return; }
  if (e.target.id === "playersBack") { S.players = false; S.playerEdit = null; render(); return; }
  let t = e.target.closest("button, [data-say]"); if (!t) return;
  // Nepali text inside a button belongs to that button (lesson stones, answer options, tiles, cards).
  if (t.matches("span[data-say]") && t.closest("button")) t = t.closest("button");
  // Any tappable Nepali text (outside answer buttons) just plays its sound.
  if (t.matches("span[data-say]") && !t.closest(".opt, .tile, .card, .stone, .flashcard")) { say(t.dataset.say, t); return; }
  if (t.id === "wotdPlay") {
    say(t.dataset.say, t);
    if (P.wotdDay !== today()) { P.wotdDay = today(); P.xp += 5; save(); beep("good"); setTimeout(render, 150); }
    return;
  }
  if (t.dataset.wotdLesson) { const l = window.LESSONS.find(x => x.id === t.dataset.wotdLesson); say(K(l.ne)); S.sheet = l.id; render(); return; }
  if (t.matches("button.say")) { say(t.dataset.say, t); return; }
  if (t.dataset.lesson) { const l = window.LESSONS.find(x => x.id === t.dataset.lesson); say(K(l.ne)); S.sheet = l.id; render(); return; }
  if (t.id === "sheetClose") { S.sheet = null; render(); return; }
  if (t.id === "goCards") { openCards(S.sheet); return; }
  if (t.id === "goPrint") { S.lesson = window.LESSONS.find(l => l.id === S.sheet); S.sheet = null; S.screen = "print"; render(); window.scrollTo(0, 0); return; }
  if (t.id === "printNow") { try { window.print(); } catch (err) {} return; }
  if (t.id === "openStickers") { S.stickers = true; beep("tap"); render(); return; }
  if (t.id === "stickClose") { S.stickers = false; render(); return; }
  if (t.dataset.sticker) {
    const x = stickerState().find(s => s.id === t.dataset.sticker);
    if (!x) return;
    const line = x.got ? x.line : window.STICKER_LOCKED;
    t.classList.remove("bounce"); void t.offsetWidth; t.classList.add("bounce");
    if (x.got) beep("good");
    say(K(line.ne), t);
    let b = $("#stickSay");
    if (!b) { b = document.createElement("div"); b.id = "stickSay"; t.after(b); }
    b.className = "stick-say" + (x.got ? "" : " locked");
    b.innerHTML = `<span class="stick-say-pic${x.got ? "" : " locked"}" aria-hidden="true">${stickerPic(x, true)}</span><span>${neSpan(line.ne)} <span class="rom">${esc(line.rom)}</span><small>${esc(line.en)}</small></span>`;
    return;
  }
  if (t.id === "copyShare") {
    const txt = shareText();
    const ok = () => { t.textContent = "✓ Copied! Paste it in your family chat"; };
    try { navigator.clipboard.writeText(txt).then(ok, () => { selectShare(); t.textContent = "Select the message above and copy it"; }); } catch (err) { selectShare(); }
    return;
  }
  if (t.id === "shareNow") { shareOrCopy(t, { title: "Sajilo Nepali", text: shareText() }, shareText()); return; }
  if (t.id === "goPlay") { const id = S.sheet; S.sheet = null; startLesson(id); return; }
  if (t.id === "cardPrev") { moveCard(-1); return; }
  if (t.id === "cardNext") { moveCard(1); return; }
  if (t.id === "cardsPlay") { startLesson(S.lesson.id); return; }
  if (t.dataset.flashsay) { if (t.dataset.swiped) { delete t.dataset.swiped; return; } say(t.dataset.flashsay, t); return; }
  if (t.id === "shareApp") {
    const url = "https://sajilonepali.app/", text = "Check out this free Nepali game for kids with Pandu the red panda!";
    shareOrCopy(t, { title: "Sajilo Nepali · Easy Nepali for Kids", text, url }, text + " " + url);
    return;
  }
  if (t.id === "saveCode") { S.grown = "save"; render(); return; }
  if (t.id === "loadCode") { S.grown = "load"; render(); setTimeout(() => $("#codeBox") && $("#codeBox").focus(), 50); return; }
  if (t.id === "openMisses") { S.grown = "misses"; render(); return; }
  if (t.id === "grownClose") { S.grown = null; render(); return; }
  if (t.id === "offlineAudio") { saveSoundsOffline(t); return; }
  if (t.id === "copyCode") {
    const box = $("#codeBox"), msg = $("#codeMsg");
    const fallback = () => { box.focus(); box.select(); msg.textContent = "Select the code above and copy it."; };
    try { navigator.clipboard.writeText(box.value).then(() => { msg.textContent = "✓ Copied! Paste it on the other device."; }, fallback); } catch (err) { fallback(); }
    return;
  }
  if (t.id === "applyCode") {
    const msg = $("#codeMsg");
    try {
      if (!$("#codeBox").value.trim()) { msg.textContent = "Paste a save code first."; return; }
      if (!confirm("Replace the players and progress on this device?")) return;
      const n = loadSaveCode($("#codeBox").value); msg.textContent = `✓ Loaded ${n} player${n > 1 ? "s" : ""}!`; setTimeout(() => location.reload(), 700);
    } catch (err) { msg.textContent = "⚠️ " + (err.message.includes("JSON") || err.name === "InvalidCharacterError" ? "This save code is damaged. Copy it again." : err.message); }
    return;
  }
  if (t.dataset.accept) {
    const m = P.misses[+t.dataset.accept]; P.accepted = P.accepted || {};
    (P.accepted[m.en] = P.accepted[m.en] || []).push(m.got);
    P.misses = P.misses.filter(x => !(x.en === m.en && x.got === m.got)); save(); beep("good"); render(); if (!P.misses.length) { S.grown = null; render(); } return;
  }
  if (t.dataset.dismiss) { P.misses.splice(+t.dataset.dismiss, 1); save(); if (!P.misses.length) S.grown = null; render(); return; }
  if (t.id === "openPlayers") { S.players = true; S.playerEdit = null; beep("tap"); render(); return; }
  if (t.id === "playersClose") { S.players = false; S.playerEdit = null; render(); return; }
  if (t.dataset.player) { if (t.dataset.player === PL.current) { S.players = false; render(); } else { beep("good"); switchPlayer(t.dataset.player); } return; }
  if (t.id === "playerAdd") { S.playerEdit = "new"; S.pickAvatar = null; render(); setTimeout(() => $("#playerName") && $("#playerName").focus(), 50); return; }
  if (t.dataset.editPlayer) { S.playerEdit = t.dataset.editPlayer; S.pickAvatar = null; render(); return; }
  if (t.dataset.avatar) {
    S.pickAvatar = t.dataset.avatar;
    document.querySelectorAll(".avatar").forEach(a => { const on = a === t; a.classList.toggle("on", on); a.setAttribute("aria-pressed", on); });
    beep("tap"); return;
  }
  if (t.id === "playerCancel") { S.playerEdit = null; render(); return; }
  if (t.id === "playerSave") {
    const av = $(".avatar.on").dataset.avatar;
    let name = $("#playerName").value.trim().slice(0, 14);
    if (S.playerEdit === "new") {
      let n = 2; while (PL.list.some(x => x.id === "p" + n)) n++;
      const id = "p" + n; PL.list.push({ id, name: name || "Player " + n, avatar: av }); savePlayers(); beep("good"); switchPlayer(id);
    } else {
      const x = PL.list.find(x => x.id === S.playerEdit); x.name = name || x.name; x.avatar = av; savePlayers(); S.playerEdit = null; render();
    }
    return;
  }
  if (t.id === "playerDelete") {
    const id = t.dataset.id, x = PL.list.find(p => p.id === id);
    if (!confirm(`Remove ${x.name} and all their stars?`)) return;
    try { localStorage.removeItem(keyFor(id)); } catch (e) {}
    PL.list = PL.list.filter(p => p.id !== id); S.playerEdit = null;
    if (PL.current === id) { switchPlayer(PL.list[0].id); return; }
    savePlayers(); render(); return;
  }
  if (t.dataset.jump) {
    const el = document.getElementById("ch-" + t.dataset.jump);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    beep("tap"); return;
  }
  if (t.dataset.level) { P.level = t.dataset.level; save(); beep("tap"); render(); return; }
  if (t.id === "tRom") { P.romBy[P.level] = !romOn(); save(); render(); return; }
  if (t.id === "tBeeps") { P.beeps = P.beeps === false; save(); render(); beep("tap"); return; }
  if (t.id === "tSound") { P.sound = !P.sound; save(); render(); return; }
  if (t.id === "tReset") {
    if (t.dataset.confirm) { P = { ...fresh(), level: P.level }; save(); render(); }
    else { t.dataset.confirm = "1"; t.textContent = "Tap again to erase all stars"; }
    return;
  }
  if (t.id === "quit" || t.id === "home") { S.screen = "map"; render(); window.scrollTo(0, 0); return; }
  if (t.id === "again") { startLesson(S.lesson.id); return; }
  if (t.id === "next") { if (S.queue[0] && S.queue[0].type === "learn" && !S.answered) { S.queue.shift(); S.done++; } nextStep(); return; }
  if (t.id === "check") { const ty = S.queue[0].type; ty === "build" ? checkBuild() : ty === "trace" ? checkTrace() : ty === "typeMeaning" ? checkTyped() : checkChoice(); return; }
  if (S.screen !== "lesson") return;
  if (t.dataset.learn) {
    say(t.dataset.learn, t); t.classList.add("heard"); t.querySelector(".tick").textContent = "✓ heard";
    const heard = document.querySelectorAll(".card.heard").length, btn = $("#next");
    if (btn && btn.disabled) { btn.textContent = learnLabel(heard); if (heard >= learnNeeded()) { btn.disabled = false; setTimeout(() => beep("good"), 500); } }
    return;
  }
  if (S.answered) return;
  if (t.dataset.i != null) {
    S.sel = +t.dataset.i;
    document.querySelectorAll(".opt").forEach(b => b.classList.toggle("sel", b === t));
    $("#check").disabled = false;
    if (t.dataset.optsay) say(t.dataset.optsay, t); else beep("tap");
    return;
  }
  if (t.dataset.l != null) { matchTap("l", +t.dataset.l); return; }
  if (t.dataset.r != null) { matchTap("r", +t.dataset.r); return; }
  if (t.dataset.t != null && !t.classList.contains("used")) { S.built.push(+t.dataset.t); say(K(S.bank[+t.dataset.t][0]), t); drawBuilt(); return; }
  if (t.dataset.b != null) { S.built.splice(+t.dataset.b, 1); drawBuilt(); return; }
});

render();
</script>
