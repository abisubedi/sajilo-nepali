<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1280px;overflow:hidden}
body{position:relative;font-family:"Baloo 2",sans-serif;background:radial-gradient(ellipse at 30% 40%,#2d4a8a 0%,#1f2a44 60%,#141c33 100%);color:#fff}
.flags{position:absolute;top:0;left:0;right:0;height:34px;display:flex}.flags i{flex:1}
.flags i:nth-child(5n+1){background:#2f6fd6}.flags i:nth-child(5n+2){background:#fff}.flags i:nth-child(5n+3){background:#e2453c}.flags i:nth-child(5n+4){background:#2fa75a}.flags i:nth-child(5n+5){background:#f6b71c}
.glow{position:absolute;left:120px;top:250px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(246,183,28,.35),rgba(246,183,28,0) 65%)}
.pandu{position:absolute;left:190px;top:330px;width:560px;height:560px;border-radius:50%;background:#fffaf0;border:10px solid #f6b71c;box-shadow:0 20px 50px rgba(0,0,0,.4);display:grid;place-items:center;overflow:hidden}
.pandu img{width:96%}
.txt{position:absolute;left:800px;top:330px;width:560px}
h1{font-size:122px;line-height:.92;font-weight:800;letter-spacing:-.01em}
h2{font-size:84px;line-height:1.05;color:#f6b71c;font-weight:700;margin-top:10px}
p{font:800 40px/1.25 "Nunito",sans-serif;margin-top:26px;color:#e9eefb}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}.chips span{font:800 26px/1 "Nunito";background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);padding:12px 18px;border-radius:999px}
.ph{position:absolute;width:300px;padding:12px;border-radius:46px;background:#0d111b;box-shadow:0 26px 60px rgba(0,0,0,.5),inset 0 0 0 3px #3a4256}
.ph img{display:block;width:100%;border-radius:36px}
.p1{left:1360px;top:200px;transform:rotate(-6deg)}.p2{left:1520px;top:400px;transform:rotate(5deg)}
.st{position:absolute;width:150px;height:150px;border-radius:50%;background:#fffaf0;border:6px solid #fff;box-shadow:0 10px 24px rgba(0,0,0,.35);overflow:hidden}.st img{width:100%}
</style></head><body><div class="flags"></div><div class="glow"></div>
<div class="pandu"><img src="img/pandu-namaste.webp"></div>
<div class="st" style="left:110px;top:840px"><img src="img/w-elephant.webp"></div>
<div class="st" style="left:640px;top:250px;width:130px;height:130px"><img src="img/w-dog.webp"></div>
<div class="txt"><h1>Sajilo Nepali</h1><h2 lang="ne">सजिलो नेपाली</h2><p>Everyday Nepali for kids<br>and beginners</p>
<div class="chips"><span>🔊 Real Nepali voice</span><span>🎮 Games</span><span>📖 Stories</span></div></div>
<div class="ph p1"><img src="raw-phone-03-lesson.png"></div><div class="ph p2"><img src="raw-phone-06-story.png"></div>
<script>document.querySelector(".flags").innerHTML="<i></i>".repeat(30)</script></body></html>
